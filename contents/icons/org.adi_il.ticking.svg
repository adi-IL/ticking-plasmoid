<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vercelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E599"/>
      <stop offset="100%" stop-color="#0070F3"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bgGrad)" stroke="#333333" stroke-width="1.5"/>
  
  <!-- Outer Chrono Arc Track -->
  <circle cx="32" cy="34" r="18" fill="none" stroke="#222222" stroke-width="3"/>
  <circle cx="32" cy="34" r="18" fill="none" stroke="url(#vercelGrad)" stroke-width="3" stroke-dasharray="113.1" stroke-dashoffset="35" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Top Crown / Push Button -->
  <rect x="29" y="10" width="6" height="4" rx="1.5" fill="#EEEEEE"/>
  
  <!-- Center Pivot -->
  <circle cx="32" cy="34" r="2.5" fill="#00E599"/>
  
  <!-- Clock / Stopwatch Hands -->
  <line x1="32" y1="34" x2="32" y2="22" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="34" x2="42" y2="34" stroke="#00E599" stroke-width="2" stroke-linecap="round"/>

  <!-- Subtle Accent Dots -->
  <circle cx="32" cy="19" r="1" fill="#888888"/>
  <circle cx="47" cy="34" r="1" fill="#888888"/>
  <circle cx="32" cy="49" r="1" fill="#888888"/>
  <circle cx="17" cy="34" r="1" fill="#888888"/>
</svg>
